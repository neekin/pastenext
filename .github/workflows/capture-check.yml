name: capture-check
on:
  push:
    branches: ['codex/**']
    paths: ['src-tauri/**', 'src/capture/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/capture-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pastenext-ffmpeg-*.zip
          key: windows-media-${{ hashFiles('scripts/setup-windows-media.py') }}
      - name: Prepare packaged Windows media runtime
        env:
          PASTENEXT_MEDIA_CACHE_DIR: ${{ runner.temp }}
        run: python scripts/setup-windows-media.py
      - name: Frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Native unit and Windows media tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
      - name: Native selection interactions
        shell: pwsh
        run: |
          & src-tauri/capture_selector.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Windows selector self-test failed" }
      - name: Build Windows client for native validation
        shell: pwsh
        run: |
          $config=Get-Content src-tauri/tauri.preview.conf.json -Raw | ConvertFrom-Json
          foreach($window in $config.app.windows) {
            $window | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue '--remote-debugging-port=9222'
          }
          $config | ConvertTo-Json -Depth 20 | Set-Content "$env:RUNNER_TEMP/tauri-native-test.json"
          pnpm tauri build --debug --bundles nsis --config "$env:RUNNER_TEMP/tauri-native-test.json"
      - name: Install and exercise native Windows client
        shell: pwsh
        run: ./scripts/test-windows-client.ps1
      - name: Build clean Preview installer
        shell: pwsh
        run: |
          pnpm tauri build --debug --bundles nsis --config src-tauri/tauri.preview.conf.json
          if($LASTEXITCODE -ne 0) { throw 'Clean Preview build failed' }
          Copy-Item 'src-tauri/target/debug/bundle/nsis/*.exe' "$env:RUNNER_TEMP/pastenext-native-report/"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-capture-check
          path: |
            src-tauri/ffmpeg/runtime.json
            ${{ runner.temp }}/pastenext-native-report/*
