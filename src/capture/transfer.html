<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PasteNext · 传图</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:#1c2033;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:40px 24px}main{max-width:440px;margin:0 auto;background:white;border-radius:24px;padding:28px;box-shadow:0 16px 80px #27376512}small{color:#737b91}h1{font-size:28px;margin:18px 0 8px}p{line-height:1.6;color:#697187}button,a.download{display:block;text-align:center;width:100%;background:#5655d8;color:white;border:0;border-radius:12px;padding:16px;font:inherit;text-decoration:none;cursor:pointer}button:disabled{opacity:.5}label{display:block;border:2px dashed #d6d9e6;border-radius:16px;padding:26px 12px;margin:24px 0;text-align:center;color:#5655d8}input{max-width:100%;margin-top:12px}#status{min-height:48px;overflow-wrap:anywhere}hr{border:0;border-top:1px solid #eceef5;margin:26px 0}[hidden]{display:none!important}</style>
<main><small>PASTENEXT / LOCAL TRANSFER</small><h1>图片，近在手边。</h1><p>手机与电脑通过当前 Wi-Fi 直接传输。连接有效期 10 分钟，关闭电脑上的分享即可停止。</p>
<div __DOWNLOAD__><a class="download" href="download" download>下载电脑分享的文件</a><hr></div>
<label>发送图片到电脑<input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/bmp,image/tiff"></label><button id="send" disabled>选择图片后发送</button><p id="status" role="status">支持 PNG、JPEG、GIF、BMP、TIFF，最大 40 MB。</p><small>如果无法连接，请确认在同一 Wi-Fi 下，并允许 PasteNext 访问本地网络。</small></main>
<script>
const input=document.querySelector('#file'),button=document.querySelector('#send'),status=document.querySelector('#status');let file;
input.onchange=()=>{file=input.files[0];button.disabled=!file;button.textContent='发送到电脑';};
button.onclick=async()=>{if(!file)return;if(file.size>40*1024*1024){status.textContent='图片超过 40 MB，请选择较小的文件。';return;}button.disabled=true;status.textContent='正在传输…';try{const response=await fetch('upload',{method:'POST',body:file,headers:{'Content-Type':'application/octet-stream'}});if(!response.ok)throw new Error(await response.text());status.textContent='已送达电脑，可以在 PasteNext 中查看和编辑。';input.value='';file=null;button.textContent='发送成功';}catch(e){status.textContent='传输失败：'+e.message;button.disabled=false;}};
</script></html>
